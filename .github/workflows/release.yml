name: Release

on:
  push:
    branches:
      - main

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing

jobs:
  release:
    # Off until releases are switched on: set the repository variable
    # NPM_RELEASE to "enabled" (see RELEASING.md). Never runs in forks.
    if: github.repository == 'ninadsutrave/react-native-shrinking-tab-bar' && vars.NPM_RELEASE == 'enabled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Create release pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: yarn changeset version
          publish: yarn release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
