name: Release

on:
  push:
    branches:
      - main

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing

jobs:
  release:
    # Off until releases are switched on: set the repository variable
    # NPM_RELEASE to "enabled" (see RELEASING.md). Never runs in forks.
    if: github.repository == 'ninadsutrave/react-native-shrinking-tab-bar' && vars.NPM_RELEASE == 'enabled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      # Opens or updates the Version Packages pull request while there are
      # changesets. Publishing is done by scripts/publish.mjs, because the
      # action only tags and releases workspace packages, not a root package.
      - name: Create release pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: yarn changeset version
          pr-title: Version Packages
          commit-message: Version Packages

      - name: Publish
        if: steps.changesets.outputs.has-changesets == 'false'
        run: node scripts/publish.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
