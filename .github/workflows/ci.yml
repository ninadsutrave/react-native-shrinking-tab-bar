name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests
        run: yarn test --ci

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      - name: Check the packed files
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const need = ['lib/module/index.js', 'lib/module/glass.js', 'lib/typescript/src/index.d.ts', 'lib/typescript/src/glass.d.ts'];
            const missing = need.filter(f => !files.includes(f));
            const stray = files.filter(f => /^(example|test)\//.test(f));
            if (missing.length || stray.length) {
              console.error({ missing, stray });
              process.exit(1);
            }
            console.log(files.length + ' files packed');
          "
